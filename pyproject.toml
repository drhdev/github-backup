[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "github-backup"
version = "1.1.3"
description = "Production backups for GitHub repositories, gists, and optional service data"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "github-backup contributors" }]
keywords = ["backup", "git", "github", "github-enterprise", "nas", "s3"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/drhdev/github-backup"
Documentation = "https://github.com/drhdev/github-backup#readme"
Issues = "https://github.com/drhdev/github-backup/issues"
Repository = "https://github.com/drhdev/github-backup.git"
Security = "https://github.com/drhdev/github-backup/security/policy"
Changelog = "https://github.com/drhdev/github-backup/blob/main/CHANGELOG.md"

[project.optional-dependencies]
s3 = ["boto3>=1.43.114,<2"]
dev = [
  "mypy>=2.4.0,<3",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.17.1,<1",
  "types-boto3[s3]>=1.43.114,<2",
]

[project.scripts]
github-backup = "github_backup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/github_backup"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.uv-cache",
  "/.venv",
  "/.coverage",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/dist",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["github_backup"]
